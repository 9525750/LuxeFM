general:
  public_url: https://luxefm.example.com
  secret_key: change_me_to_random_string
  allowed_cors_origins:
    - https://luxefm.example.com

storage:
  path: /srv/libretime

database:
  host: postgres
  port: 5432
  name: libretime
  user: libretime
  password: changeme

rabbitmq:
  host: rabbitmq
  port: 5672
  user: libretime
  password: changeme
  vhost: /libretime

stream:
  outputs:
    icecast:
      - enabled: true
        host: icecast
        port: 8000
        mount: main
        source_user: source
        source_password: changeme
        audio:
          format: mp3
          bitrate: 128
          channels: 2
          samplerate: 44100
